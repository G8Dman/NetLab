name: Build six NetLab mods

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build all mods and check the model without launching Minecraft
        if: runner.os != 'Windows'
        run: ./dev.sh build

      - name: Build and check on Windows without launching Minecraft
        if: runner.os == 'Windows'
        shell: cmd
        run: dev.cmd build

      - name: Check Academy and handbook without starting Minecraft
        if: runner.os != 'Windows'
        run: python tools/check_academy.py --online

      - name: Prepare ready-to-install NetLab mods
        run: python tools/package_mods.py

      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: netlab-minecraft-1.21.1-${{ matrix.os }}
          if-no-files-found: error
          path: |
            mods/*.jar
            MODS.json
            SHA256SUMS.txt
